name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fc_core:
    name: fc_core host tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S firmware/fc_core -B build/fc_core -DFC_SANITIZE=ON -DCMAKE_C_COMPILER=clang
          cmake --build build/fc_core -j
      - name: Test
        run: ctest --test-dir build/fc_core --output-on-failure
      - name: Static analysis (cppcheck)
        run: sudo apt-get install -y cppcheck && make core-lint
      - name: Link codec fuzz smoke (60 s)
        run: |
          cmake -S firmware/fc_core -B build/fuzz -DFC_FUZZ=ON -DCMAKE_C_COMPILER=clang
          cmake --build build/fuzz --target fuzz_link
          build/fuzz/fuzz_link -max_total_time=60
      - name: Coverage
        run: |
          pipx install gcovr
          cmake -S firmware/fc_core -B build/fc_core-cov -DFC_COVERAGE=ON -DCMAKE_C_COMPILER=gcc
          cmake --build build/fc_core-cov -j
          ctest --test-dir build/fc_core-cov
          gcovr -r . --include-internal-functions \
            --filter 'firmware/flight/components/core/' --filter 'firmware/fc_core/src/' --filter 'firmware/fc_core/host/' \
            --exclude '.*/controller_indi\.c' --exclude '.*/position_controller_indi\.c' --exclude '.*/controller_mellinger\.c' \
            --markdown-summary "$GITHUB_STEP_SUMMARY" --print-summary build/fc_core-cov

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Set up sim environment
        run: |
          uv venv --python 3.12 sim/.venv
          uv pip install --python sim/.venv/bin/python -r sim/requirements.txt
      - name: Run sim tests
        run: sim/.venv/bin/python -m pytest sim
      - name: Gate G1 (math model)
        working-directory: sim
        run: |
          .venv/bin/python g1_report.py --samples 300 --no-plots --out "$RUNNER_TEMP/g1"
          cat "$RUNNER_TEMP/g1/README.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Vibration and sampled RPM stability checks
        working-directory: sim
        run: |
          .venv/bin/python vibration_report.py --no-plots --out "$RUNNER_TEMP/vibration"
          cat "$RUNNER_TEMP/vibration/README.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Camera-loss flow braking checks
        working-directory: sim
        run: |
          .venv/bin/python flow_braking_report.py --no-plots --out "$RUNNER_TEMP/flow_braking"
          cat "$RUNNER_TEMP/flow_braking/README.md" >> "$GITHUB_STEP_SUMMARY"

  firmware:
    name: ${{ matrix.project }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: flight
            target: esp32p4
          - project: flight
            target: esp32s3
          - project: radio
            target: esp32c5
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v7
      - name: Build firmware/${{ matrix.project }} for ${{ matrix.target }}
        shell: bash
        working-directory: firmware/${{ matrix.project }}
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py -B build-${{ matrix.target }} \
            -D SDKCONFIG=build-${{ matrix.target }}/sdkconfig \
            -D IDF_TARGET=${{ matrix.target }} \
            build
      - name: Report image size
        shell: bash
        working-directory: firmware/${{ matrix.project }}
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py -B build-${{ matrix.target }} \
            -D SDKCONFIG=build-${{ matrix.target }}/sdkconfig \
            size
